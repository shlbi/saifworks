name: Apply approved hero composition
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-approved-hero.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply the exact browser-tested source bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = 'ed72bcabce76eb8546dbafbb13552e3bfc5e6328'
          test "$(git hash-object README.md)" = 'd1cfcf4f54922f65da2b8d1e2b2ccbd8134b1a3a'
          curl --fail --location --retry 2 --max-time 60 'https://at.adobe.com/fow9MocbJ8XbrMAl' --output /tmp/saifworks-hero-update.zip
          echo '5ed77f421ccb1921b30e594adc3deb6aca502fd70a01ba676b6a45696d3804be  /tmp/saifworks-hero-update.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          allowed={'index.html','hero.css','hero.js','README.md','.gitignore','tests/verify-hero.mjs','assets/hero-collage.webp','assets/hero-knot.webp'}
          with zipfile.ZipFile('/tmp/saifworks-hero-update.zip') as z:
              assert set(z.namelist())==allowed, 'Unexpected bundle paths'
              for name in sorted(allowed):
                  dest=Path(name)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(name))
          html=Path('index.html').read_text()
          assert 'id="hero-art-board"' in html
          assert 'mix-blend-mode:multiply' not in html
          assert 'canvas id="sculpture-canvas"' not in html
          assert html.count('class="object ')==4
          PY
          test "$(git hash-object index.html)" = 'eff65f9703fbb2e77ba6819c114a32a5877b4e17'
          node --check hero.js
          node --check tests/verify-hero.mjs
          if test "$(git hash-object portrait.webp)" = '0e97f8c04f15391cc80455291f0b577aac628804'; then git rm portrait.webp; fi
          git rm .github/workflows/import-approved-hero.yml .github/workflows/apply-approved-hero.yml
          git add index.html hero.css hero.js README.md .gitignore tests/verify-hero.mjs assets/hero-collage.webp assets/hero-knot.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: match approved hero composition and preserve clear portrait'
          git pull --rebase origin main
          git push origin HEAD:main
