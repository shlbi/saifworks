name: Apply popup-only project screenshots
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-project-screenshots.yml']
permissions:
  contents: write
concurrency:
  group: apply-project-screenshots
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Import approved original screenshots and guarded source patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 'https://at.adobe.com/N1tL4ZNcvI7i56QD' --output "$RUNNER_TEMP/project-screenshots.zip"
          echo "226e34e8411f89bc4c9b59ece5c10013a6dcc377002d53dda63b76c8903d9e83  $RUNNER_TEMP/project-screenshots.zip" | sha256sum --check
          python3 -m zipfile -e "$RUNNER_TEMP/project-screenshots.zip" "$RUNNER_TEMP/project-screenshots-update"
          python3 "$RUNNER_TEMP/project-screenshots-update/apply.py" "$GITHUB_WORKSPACE"
      - name: Install isolated browser checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/saifworks-qa" --no-save --package-lock=false playwright
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/saifworks-qa/node_modules/playwright" >> "$GITHUB_ENV"
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/saifworks-qa/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Verify unchanged cards and screenshot popups before publishing
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:8765
          TEST_PHASE: local
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/saifworks-http.log" 2>&1 &
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          node tests/verify-project-screenshots.mjs
          node tests/verify-hero.mjs
      - name: Commit tested screenshots and popup changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html project-screenshots.css assets/project-screenshots/ tests/verify-project-screenshots.mjs tests/verify-hero.mjs
          git rm .github/workflows/apply-project-screenshots.yml
          git diff --cached --stat
          git commit -m 'feat: show actual REPOT and Parallax screenshots only in project dialogs'
          git push origin HEAD:main
          git rev-parse HEAD | tee test-results/revision.txt
      - name: Wait for the updated production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsSL --max-time 15 "https://saifworks.vercel.app/?screenshots=$(git rev-parse --short HEAD)" | grep -q 'project-screenshots.css'; then
              exit 0
            fi
            sleep 6
          done
          echo 'The source is committed, but the updated production deployment was not available within this check.' >&2
          exit 1
      - name: Verify screenshot popups on the actual production site
        env:
          BASE_URL: https://saifworks.vercel.app
          TEST_PHASE: live
        run: node tests/verify-project-screenshots.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: project-screenshots-browser-check
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
