name: Fix mobile icons and clarify Parallax
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mobile-ui-polish.yml']
permissions:
  contents: write
concurrency:
  group: saifworks-mobile-ui-polish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply guarded source changes
        run: |
          node --check ui-icons.js
          node --check tools/apply-mobile-polish.cjs
          node tools/apply-mobile-polish.cjs
          printf '\n@media(max-width:760px){.project-quickstart{margin-top:14px}}\n' >> ui-polish.css
      - name: Install isolated browser checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/saifworks-qa" --no-save --package-lock=false playwright
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/saifworks-qa/node_modules/playwright" >> "$GITHUB_ENV"
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/saifworks-qa/node_modules/.bin/playwright" install --with-deps chromium
          fi
          "$RUNNER_TEMP/saifworks-qa/node_modules/.bin/playwright" install --with-deps webkit
      - name: Verify vectors and product details before publishing
        env:
          BASE_URL: http://127.0.0.1:8765
          TEST_PHASE: local
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/saifworks-http.log" 2>&1 &
          for attempt in $(seq 1 20); do curl -fsS "$BASE_URL" >/dev/null && break; sleep 1; done
          node tests/verify-mobile-icons.mjs
          node tests/verify-project-screenshots.mjs
          node tests/verify-hero.mjs
      - name: Commit tested site update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply-mobile-polish.cjs .github/workflows/mobile-ui-polish.yml
          git add index.html README.md ui-polish.css
          git commit -m 'fix: use vector icons on mobile and explain the Parallax evidence-mapping prototype'
          git push origin HEAD:main
          git rev-parse HEAD > test-results/published-commit.txt
      - name: Wait for public production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsSL --max-time 20 "https://saifworks.vercel.app/?ui-check=$GITHUB_RUN_ID" | grep 'saifworks-ui-release' >/dev/null; then exit 0; fi
            sleep 5
          done
          echo 'Production has not served the updated source yet'; exit 1
      - name: Verify production in Chromium and mobile WebKit
        env:
          BASE_URL: https://saifworks.vercel.app
          TEST_PHASE: live
        run: node tests/verify-mobile-icons.mjs
      - name: Verify the custom domain without changing DNS
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 25 https://saifworks.com | grep 'saifworks-ui-release' >/dev/null; then
            BASE_URL=https://saifworks.com TEST_PHASE=custom-domain node tests/verify-mobile-icons.mjs
          else
            echo 'The custom domain did not serve the updated page during this check.' | tee test-results/custom-domain-note.txt
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-icons-parallax-check
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
